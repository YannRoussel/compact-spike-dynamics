[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inverse-ephys-alpha-beta"
version = "0.1.0"
description = "Compact neuronal spike dynamics and transcriptomic prediction, with historical HH kinetics experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "joblib>=1.2",
    "matplotlib>=3.6",
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "scipy>=1.9",
]

[project.optional-dependencies]
efel = ["efel"]
nwb = ["h5py>=3.8"]
optim = ["deap>=1.4"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
inverse-ephys = "inverse_ephys_alpha_beta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
